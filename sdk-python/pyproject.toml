[build-system]
requires = ["hatchling>=1.18"]
build-backend = "hatchling.build"

[project]
name = "unsent-sdk"
dynamic = ["version"]
description = "Official Python SDK for the self-hosted Unsent email service. Zero dependencies; sync and asyncio clients, Django email backend, FastAPI helpers."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["unsent", "email", "smtp", "sdk", "transactional-email", "idempotency", "django", "fastapi"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Framework :: AsyncIO",
  "Framework :: Django",
  "Framework :: FastAPI",
  "Topic :: Communications :: Email",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
django = ["django>=3.2"]
fastapi = ["fastapi>=0.100"]
dev = ["pytest>=7", "django>=3.2", "fastapi>=0.100", "httpx>=0.24", "flask>=2.3", "mypy>=1.8", "build"]

[project.urls]
Homepage = "https://github.com/Rishi-Bhati/Serverless-email-service/tree/main/sdk-python#readme"
Issues = "https://github.com/Rishi-Bhati/Serverless-email-service/issues"
Repository = "https://github.com/Rishi-Bhati/Serverless-email-service"

[tool.hatch.version]
path = "src/unsent/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/unsent"]

[tool.hatch.build.targets.sdist]
include = ["src/unsent", "tests", "examples", "README.md", "CHANGELOG.md", "pyproject.toml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
  "error::pytest.PytestUnraisableExceptionWarning",
  "ignore:.*Django 2028.*:Warning",
  "ignore:.*MAILERS.*:Warning",
  "ignore:.*fail_silently.*deprecated.*:Warning",
]

[tool.mypy]
strict = true
files = ["src/unsent"]

[[tool.mypy.overrides]]
module = ["django.*", "fastapi.*", "starlette.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["unsent.django"]
disallow_subclassing_any = false
warn_unused_ignores = false
